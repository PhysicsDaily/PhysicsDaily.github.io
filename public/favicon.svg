<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>PhysicsDaily</title>
  <!--
    Shares the mark geometry of src/assets/logo-light.svg and logo-dark.svg:
    centre (32,32), planet r=13, ring rx=26 ry=8 tilted -16deg, moon seated on the
    ring's true left tip at (7, 39.2). Mirror any shape change into all three.

    Two deliberate departures from the logo marks, both for the 16px tab render:
    the full square viewBox makes room for the plate, and the planet is a solid ink
    disc instead of a dark disc with an ink outline. Outlined, the planet needs its
    ~0.7px stroke to survive against a near-identical fill and it collapses into a
    dark blob; filled, the silhouette carries itself and the accent ring still
    reads crossing it.
  -->
  <defs>
    <!-- The ring's near half is the half below its own major axis, so the clip is
         rotated with the ring instead of cutting straight across it. -->
    <clipPath id="pdf-ring-front">
      <rect x="-32" y="32" width="128" height="64" transform="rotate(-16 32 32)"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#101317"/>
  <!-- Ring, drawn whole; the opaque planet hides the far half. Drawing the full
       ellipse rather than clipping it to the far half keeps the two arcs from
       leaving an antialiasing seam where they would meet at the tips. -->
  <ellipse cx="32" cy="32" rx="26" ry="8" transform="rotate(-16 32 32)" fill="none" stroke="#92b4ff" stroke-width="2.8"/>
  <!-- Planet -->
  <circle cx="32" cy="32" r="13" fill="#f4f4f2"/>
  <!-- Ring, near half, passing in front of the planet -->
  <g clip-path="url(#pdf-ring-front)">
    <ellipse cx="32" cy="32" rx="26" ry="8" transform="rotate(-16 32 32)" fill="none" stroke="#92b4ff" stroke-width="2.8"/>
  </g>
  <!-- Moon, threaded onto the ring at its tip -->
  <circle cx="7" cy="39.2" r="2.4" fill="#f4f4f2"/>
</svg>
